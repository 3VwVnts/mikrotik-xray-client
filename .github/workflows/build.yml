name: Build and publish latest

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "docker/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,amd64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short

      # ---------- 1. Multiarch сборка ----------
      - name: Build and push multiarch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 2. Smoke-test на ARMv7 ----------
      - name: Build armv7 image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm/v7
          load: true
          tags: xray-smoke:armv7
          cache-from: type=gha

      - name: Verify binary architecture
        run: |
          set -e
          docker run --rm --platform linux/arm/v7 --entrypoint /bin/sh \
            xray-smoke:armv7 -c 'readelf -h /usr/local/bin/xray | grep Machine'

      - name: Smoke test — socks-only (armv7)
        timeout-minutes: 5
        run: |
          set -e
          docker run -d --name smoke --platform linux/arm/v7 \
            -e VLESS_URI="vless://00000000-0000-0000-0000-000000000000@127.0.0.1:443?encryption=none&flow=xtls-rprx-vision&security=reality&sni=www.goteleport.com&fp=chrome&pbk=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&sid=0123456789abcdef&type=tcp&headerType=none#test" \
            -e PROXY_MODE=socks-only \
            -e GEO_SKIP_DOWNLOAD=1 \
            xray-smoke:armv7

          for i in $(seq 1 60); do
            if docker logs smoke 2>&1 | grep -q "Config test OK"; then
              echo "Config test passed"
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^smoke$'; then
              echo "Container exited prematurely"
              docker logs smoke || true
              exit 1
            fi
            sleep 1
          done

          echo "=== Container logs ==="
          docker logs smoke

          docker logs smoke 2>&1 | grep -q "Starting Xray in SOCKS-only mode" \
            || { echo "Xray did not start"; docker rm -f smoke; exit 1; }

          sleep 5
          docker exec smoke pgrep -x xray >/dev/null \
            || { echo "xray process not running"; docker rm -f smoke; exit 1; }

          docker exec smoke ls -la /var/lib/xray/geo/
          docker rm -f smoke
          echo "Smoke test (armv7) PASSED"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs smoke 2>&1 || true
          docker rm -f smoke 2>/dev/null || true
