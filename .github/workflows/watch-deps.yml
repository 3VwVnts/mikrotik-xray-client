name: Watch upstream deps

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read current versions
        id: current
        run: |
          XRAY=$(grep -oP 'ARG XRAY_VERSION=\K.*' docker/Dockerfile | head -1)
          HEV=$(grep -oP 'ARG HEV_VERSION=\K.*' docker/Dockerfile | head -1)
          echo "xray=$XRAY" >> "$GITHUB_OUTPUT"
          echo "hev=$HEV"   >> "$GITHUB_OUTPUT"
          echo "Current: Xray=$XRAY hev-socks5-tunnel=$HEV"

      - name: Query latest releases
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          XRAY=$(gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name)
          HEV=$(gh api repos/heiher/hev-socks5-tunnel/releases/latest --jq .tag_name)
          echo "xray=$XRAY" >> "$GITHUB_OUTPUT"
          echo "hev=$HEV"   >> "$GITHUB_OUTPUT"
          echo "Latest:  Xray=$XRAY hev-socks5-tunnel=$HEV"

      - name: Detect changes
        id: diff
        run: |
          CHANGED=0
          [ "${{ steps.current.outputs.xray }}" != "${{ steps.latest.outputs.xray }}" ] && CHANGED=1
          [ "${{ steps.current.outputs.hev }}"  != "${{ steps.latest.outputs.hev }}"  ] && CHANGED=1
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Apply updates
        if: steps.diff.outputs.changed == '1'
        env:
          NEW_XRAY: ${{ steps.latest.outputs.xray }}
          NEW_HEV: ${{ steps.latest.outputs.hev }}
          OLD_XRAY: ${{ steps.current.outputs.xray }}
          OLD_HEV: ${{ steps.current.outputs.hev }}
        run: |
          sed -i "s|ARG XRAY_VERSION=.*|ARG XRAY_VERSION=${NEW_XRAY}|"           docker/Dockerfile
          sed -i "s|ARG HEV_VERSION=.*|ARG HEV_VERSION=\"${NEW_HEV}\"|" docker/Dockerfile
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "NEW_XRAY=$NEW_XRAY" >> "$GITHUB_ENV"
          echo "NEW_HEV=$NEW_HEV"   >> "$GITHUB_ENV"
          echo "OLD_XRAY=$OLD_XRAY" >> "$GITHUB_ENV"
          echo "OLD_HEV=$OLD_HEV"   >> "$GITHUB_ENV"

      - name: Create PR
        if: steps.diff.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="chore/bump-deps-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          BODY=$(cat <<EOF
          Автоматическое обновление upstream-зависимостей.

          | Компонент | Было | Стало |
          |---|---|---|
          | Xray-core | \`${OLD_XRAY}\` | \`${NEW_XRAY}\` |
          | hev-socks5-tunnel | \`${OLD_HEV}\` | \`${NEW_HEV}\` |

          **Что проверить перед мержем:**
          - [ ] Changelog Xray-core: https://github.com/XTLS/Xray-core/releases/tag/${NEW_XRAY}
          - [ ] Changelog hev-socks5-tunnel: https://github.com/heiher/hev-socks5-tunnel/releases/tag/${NEW_HEV}
          - [ ] Дождаться зелёного smoke-test (armv7) в CI
          - [ ] После мержа — собрать релиз тегом \`vX.Y.Z\`

          После мержа в \`master\` workflow \`build.yml\` соберёт \`latest\` и прогонит smoke-test.
          EOF
          )

          git add docker/Dockerfile
          git commit -m "chore(deps): bump Xray-core ${OLD_XRAY}→${NEW_XRAY}, hev-socks5-tunnel ${OLD_HEV}→${NEW_HEV}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore(deps): Xray ${NEW_XRAY}, hev-socks5-tunnel ${NEW_HEV}" \
            --body "$BODY" \
            --base master \
            --head "$BRANCH"
